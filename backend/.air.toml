root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "deployments", "migrations", "scripts"]
  exclude_regex = ["_test.go"]
  delay = 500
  send_interrupt = true
  kill_delay = "1s"

[misc]
  clean_on_exit = true
