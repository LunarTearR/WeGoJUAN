<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG ก่อน SVG: เบราว์เซอร์ที่อ่าน SVG ได้จะเลือก SVG, ที่เหลือ (Safari รุ่นเก่า) ใช้ PNG · sizes="32x32" กัน Chrome เลือก PNG แทน SVG -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- สีแถบเบราว์เซอร์บนมือถือ = cream (พื้นหลังของแอป) -->
    <meta name="theme-color" content="#fff9f2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Social share card for invite links (LINE, Messenger, X). Generic preview: the SPA
         renders client-side, so crawlers see this same card for every /join/:code route.
         Colours and mark follow docs/design/tokens.json + the brand-calendar favicon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeGoJUAN" />
    <meta property="og:title" content="WeGoJUAN — จับวันว่างทั้งแก๊ง ตัดสินใจเที่ยวได้เลย" />
    <meta property="og:description" content="ชวนเพื่อน หาวันที่ทุกคนว่าง แล้วล็อกวันเที่ยว แค่ส่งลิงก์เข้ากลุ่ม" />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WeGoJUAN — จับวันว่างทั้งแก๊ง ตัดสินใจเที่ยวได้เลย" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeGoJUAN — จับวันว่างทั้งแก๊ง ตัดสินใจเที่ยวได้เลย" />
    <meta name="twitter:description" content="ชวนเพื่อน หาวันที่ทุกคนว่าง แล้วล็อกวันเที่ยว แค่ส่งลิงก์เข้ากลุ่ม" />
    <meta name="twitter:image" content="/og-card.png" />

    <title>WeGoJUAN — จับวันว่างทั้งแก๊ง ตัดสินใจเที่ยวได้เลย</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
