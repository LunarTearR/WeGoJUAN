# Dev environment: Postgres → migrate → API (hot reload) → Web (Vite HMR)
# รัน: docker compose up --build

x-dev-image: &dev-image
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  working_dir: /app
  volumes:
    - ./backend:/app
    - go-mod:/go/pkg/mod              # cache dependency ไม่ต้องโหลดใหม่ทุกครั้ง
    - go-build:/root/.cache/go-build  # cache ผล build ให้ reload เร็วขึ้น

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: myapp
    ports:
      - "5434:5432"   # เปิดให้ต่อจากเครื่องได้ (DBeaver, psql, go run นอก Docker) — 5434 เพราะ 5432 ชนกับ Postgres บนเครื่อง
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myapp"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *dev-image
    command: ["goose", "-dir", "migrations", "postgres", "postgres://app:app@db:5432/myapp?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *dev-image
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://app:app@db:5432/myapp?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: dev-only-secret-change-me-at-least-32-bytes
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:26-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8080   # Vite proxy ส่ง /api ต่อไปที่ service api
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules   # แยก node_modules ของ container (Linux) ออกจากของเครื่อง
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  go-mod:
  go-build:
  web-node-modules: